<title>Grouping Example</title>
<style>
  /* Grouping h1 and p */
  h1, p {
    color: green;
    font-family: Arial, sans-serif;
background:black;
font-size:20px;
    
  }
</style>
</head>
<body>

<h1>This is a heading</h1>
<p>This is a paragraph</p>

</body>
